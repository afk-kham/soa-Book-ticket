    <radialGradient id="moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff7d6"/><stop offset="1" stop-color="#fde68a" stop-opacity="0"/></radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".62" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a0b2e" stop-opacity=".8"/></linearGradient>
    <g id="mari"><circle r="9" fill="#f97316"/><circle r="6" fill="#fb923c"/><circle r="3" fill="#fdba74"/></g>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="90" r="70" fill="url(#moon)"/>
  <!-- Thành phố người đã khuất -->
