    <rect x="-9" y="-170" width="18" height="24" rx="3" fill="#431407"/>
    <path d="M0 -42 C-34 -42 -40 -10 -26 4 C-46 16 -46 58 0 62 C46 58 46 16 26 4 C40 -10 34 -42 0 -42 Z" fill="#fafaf9"/>
