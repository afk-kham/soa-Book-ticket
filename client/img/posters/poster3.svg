    <text x="200" y="558" font-size="13" letter-spacing="5" opacity=".8">KÝ SINH TRÙNG</text>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif" font-weight="800">
    <rect x="16" y="16" width="44" height="26" rx="5" fill="#ef4444"/><text x="38" y="35" font-size="14" text-anchor="middle" fill="#fff">T18</text>
  </g>
