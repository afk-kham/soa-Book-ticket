# API Gateway (nginx) — Chế độ HTTPS tùy chọn (dùng kèm docker-compose.tls.yml).
# Redirect HTTP (:80) -> HTTPS (:443), không bật HSTS cho localhost.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/s;
# Giới hạn riêng cho POST /api/login (chống dò mật khẩu): 5 request/phút/IP, burst 5.
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    default_type application/json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    limit_req zone=api_per_ip burst=120 nodelay;

    location = /gateway-health {
        return 200 '{"status":"success","data":{"service":"api-gateway","port":443,"tls":true}}';
    }

    location ~ ^/api/movies(/|$)     { set $upstream http://movie:5001;        proxy_pass $upstream; }
    location ~ ^/api/showtimes(/|$)  { set $upstream http://showtime:5002;     proxy_pass $upstream; }
    location = /api/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        set $upstream http://user:5003;
        proxy_pass $upstream;
    }
    location ~ ^/api/(register|login|users)(/|$) { set $upstream http://user:5003; proxy_pass $upstream; }
    location ~ ^/api/booking(/|$)    { set $upstream http://booking:5004;      proxy_pass $upstream; }
    location ~ ^/api/payment(/|$)    { set $upstream http://payment:5005;      proxy_pass $upstream; }
    location ~ ^/api/notify(/|$)     { set $upstream http://notification:5006; proxy_pass $upstream; }

    location = /health { return 200 '{"status":"success","data":{"service":"api-gateway","port":443,"tls":true}}'; }

    error_page 502 503 504 = @service_down;
    location @service_down {
        add_header Access-Control-Allow-Origin * always;
        return 503 '{"status":"error","code":"SERVICE_UNAVAILABLE","message":"Dịch vụ đang tạm gián đoạn, vui lòng thử lại sau"}';
    }
    error_page 429 = @too_many;
    location @too_many {
        add_header Access-Control-Allow-Origin * always;
        return 429 '{"status":"error","code":"TOO_MANY_REQUESTS","message":"Bạn gửi yêu cầu quá nhanh, vui lòng thử lại sau"}';
    }
    location / {
        return 404 '{"status":"error","code":"NOT_FOUND","message":"Không tìm thấy endpoint"}';
    }
}
