# API Gateway (nginx): MỘT địa chỉ vào cho Client/Admin, định tuyến theo đường dẫn tới đúng service.
#   /api/movies*    -> movie:5001        /api/booking*  -> booking:5004
#   /api/showtimes* -> showtime:5002     /api/payment*  -> payment:5005
#   /api/register, /api/login, /api/users* -> user:5003    /api/notify* -> notification:5006
# - Mỗi request được gắn X-Request-ID ($request_id) và chuyển xuống service: một mã duy nhất xuyên suốt log của mọi service.
# - Giới hạn tốc độ theo IP (chống spam / dò mã OTP hàng loạt); service sập -> 503 đúng envelope lỗi chung, không treo.
# - Địa chỉ service được phân giải lúc có request (resolver của Docker) nên gateway vẫn chạy khi một service chưa lên.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=60r/s;
# Giới hạn riêng cho POST /api/login (chống dò mật khẩu): 5 request/phút/IP, burst 5. Chỉnh trực tiếp rate=/burst= tại đây nếu cần.
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;
limit_req_status 429;

server {
    listen 8000;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    default_type application/json;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    limit_req zone=api_per_ip burst=120 nodelay;

    location = /gateway-health {
        return 200 '{"status":"success","data":{"service":"api-gateway","port":8000}}';
    }

    location ~ ^/api/movies(/|$)     { set $upstream http://movie:5001;        proxy_pass $upstream; }
    location ~ ^/api/showtimes(/|$)  { set $upstream http://showtime:5002;     proxy_pass $upstream; }
    location = /api/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        set $upstream http://user:5003;
        proxy_pass $upstream;
    }
    location ~ ^/api/(register|login|users)(/|$) { set $upstream http://user:5003; proxy_pass $upstream; }
    location ~ ^/api/booking(/|$)    { set $upstream http://booking:5004;      proxy_pass $upstream; }
    location ~ ^/api/payment(/|$)    { set $upstream http://payment:5005;      proxy_pass $upstream; }
    location ~ ^/api/notify(/|$)     { set $upstream http://notification:5006; proxy_pass $upstream; }

    location = /health { return 200 '{"status":"success","data":{"service":"api-gateway","port":8000}}'; }

    error_page 502 503 504 = @service_down;
    location @service_down {
        add_header Access-Control-Allow-Origin * always;
        return 503 '{"status":"error","code":"SERVICE_UNAVAILABLE","message":"Dịch vụ đang tạm gián đoạn, vui lòng thử lại sau"}';
    }
    error_page 429 = @too_many;
    location @too_many {
        add_header Access-Control-Allow-Origin * always;
        return 429 '{"status":"error","code":"TOO_MANY_REQUESTS","message":"Bạn gửi yêu cầu quá nhanh, vui lòng thử lại sau"}';
    }
    location / {
        return 404 '{"status":"error","code":"NOT_FOUND","message":"Không tìm thấy endpoint"}';
    }
}
