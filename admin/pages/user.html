<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Người dùng — Admin SOA Đặt vé</title><link rel="stylesheet" href="../css/admin.css"></head><body>
<div id="app"><div class="card" id="list"></div></div>
<script src="../js/config.js"></script><script src="../js/common.js"></script>
<script>
Admin.shell("user", "Quản lý người dùng", "User/Auth Service · cổng 5003 · user_db (TV3) — không bao giờ hiển thị mật khẩu");
document.getElementById("page-actions").innerHTML = '<button id="btn-reg">+ Đăng ký tài khoản</button> <button class="secondary" id="btn-login">Thử đăng nhập</button>';
async function load() {
  Admin.clearError();
  try {
    var rows = await Admin.api("user", "GET", "/api/users");
    Admin.table(document.getElementById("list"), [{label: "ID", key: "id"}, {label: "Tên đăng nhập", key: "username"}, {label: "Email", key: "email"},
      {label: "Vai trò", render: function (r) { return Admin.badge(r.role); }}], rows);
  } catch (e) { Admin.showError(e); }
}
document.getElementById("btn-reg").onclick = function () {
  Admin.openForm({title: "Đăng ký tài khoản", fields: [{name: "username", label: "Tên đăng nhập", required: true}, {name: "email", label: "Email", type: "email"},
    {name: "password", label: "Mật khẩu (≥ 6 ký tự)", type: "password", required: true}],
    onSubmit: async function (d) { await Admin.api("user", "POST", "/api/register", d); Admin.toast("Đã tạo tài khoản"); load(); }});
};
document.getElementById("btn-login").onclick = function () {
  Admin.openForm({title: "Thử đăng nhập", submitLabel: "Đăng nhập", fields: [{name: "username", label: "Tên đăng nhập", required: true}, {name: "password", label: "Mật khẩu", type: "password", required: true}],
    onSubmit: async function (d) { var r = await Admin.api("user", "POST", "/api/login", d); Admin.toast("Đăng nhập OK — vai trò " + r.role); }});
};
load();
</script></body></html>
